<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img"><title>Agrupar no rellena el aire</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8Z" fill="#453f93"/></marker><pattern id="capas" width="8" height="10" patternUnits="userSpaceOnUse"><rect width="8" height="10" fill="#eec9ad"/><path d="M0 9H8" stroke="#9c4419"/></pattern></defs><style>text{font-family:Arial,sans-serif;fill:#252525;font-size:18px}.titulo{font-size:25px;font-weight:bold}.small{font-size:15px}.pieza{fill:#eec9ad;stroke:#9c4419;stroke-width:2}.hueco{fill:#e7f2fa;stroke:#367da5;stroke-width:2;stroke-dasharray:6 4}.cota{fill:none;stroke:#453f93;stroke-width:2;marker-start:url(#arr);marker-end:url(#arr)}.flecha{fill:none;stroke:#453f93;stroke-width:3;marker-end:url(#arr)}.mal{fill:#fde5e3;stroke:#a32929;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="25" y="36" class="titulo">Agrupar no rellena el aire</text><rect x="65" y="145" width="100" height="100" class="pieza"/><rect x="195" y="145" width="100" height="100" class="pieza"/><text x="60" y="290" class="">Dos cuerpos: separación 2 mm</text><rect x="50" y="130" width="260" height="130" fill="none" stroke="#367da5" stroke-dasharray="8 4"/><rect x="520" y="145" width="100" height="100" class="pieza"/><rect x="610" y="145" width="100" height="100" class="pieza"/><text x="505" y="290" class="">Solape de 1 mm: volumen continuo</text><text x="70" y="350" class="">Ambos conjuntos se pueden seleccionar con un solo clic.</text><text x="70" y="385" class="">La resistencia de la unión se comprueba aparte.</text></svg>