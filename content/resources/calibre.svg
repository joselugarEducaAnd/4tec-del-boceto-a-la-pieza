<svg xmlns="http://www.w3.org/2000/svg" width="900" height="465" viewBox="0 0 900 465" role="img"><title>Medir exteriores, interiores y profundidad</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8Z" fill="#453f93"/></marker><pattern id="capas" width="8" height="10" patternUnits="userSpaceOnUse"><rect width="8" height="10" fill="#eec9ad"/><path d="M0 9H8" stroke="#9c4419"/></pattern></defs><style>text{font-family:Arial,sans-serif;fill:#252525;font-size:18px}.titulo{font-size:25px;font-weight:bold}.small{font-size:15px}.pieza{fill:#eec9ad;stroke:#9c4419;stroke-width:2}.hueco{fill:#e7f2fa;stroke:#367da5;stroke-width:2;stroke-dasharray:6 4}.cota{fill:none;stroke:#453f93;stroke-width:2;marker-start:url(#arr);marker-end:url(#arr)}.flecha{fill:none;stroke:#453f93;stroke-width:3;marker-end:url(#arr)}.mal{fill:#fde5e3;stroke:#a32929;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="25" y="36" class="titulo">Medir exteriores, interiores y profundidad</text><rect x="50" y="150" width="770" height="35" class="pieza"/><rect x="250" y="125" width="70" height="90" class="pieza"/><text x="65" y="105" class="">Mordazas interiores</text><path d="M90 150V110H120V150 M250 150V110H220V150 M90 185V285H120V185 M250 185V285H220V185" stroke="#444" fill="#c8cbd0" stroke-width="8"/><text x="50" y="320" class="">Mordazas exteriores</text><path d="M820 169H875" stroke="#444" stroke-width="5"/><text x="710" y="130" class="small">Varilla de profundidad</text><text x="410" y="230" class="">Cerrar suave; mm; cero; perpendicular</text><text x="390" y="275" class="">Nonio del ejemplo: resolución 0,1 mm</text><text x="40" y="405">La lectura del nonio se explica en la ampliación siguiente.</text></svg>