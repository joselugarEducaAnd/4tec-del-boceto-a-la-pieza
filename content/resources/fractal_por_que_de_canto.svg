<svg xmlns="http://www.w3.org/2000/svg" width="930" height="450" viewBox="0 0 930 450" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Por qué el tetraedro se imprime de canto</title><desc id="d">A la izquierda, el tetraedro tumbado: la cara de abajo del tetraedro de arriba queda en el aire y necesitaría soportes. A la derecha, de canto: visto de lado parece una V, todas las caras están inclinadas y no necesita soportes; se recortan 2,5 mm por abajo para que tenga una tira plana que se pegue a la cama.</desc><style>
.t{font:700 22px sans-serif;fill:#3a2a20}.n{font:17px sans-serif;fill:#222}.s{font:15px sans-serif;fill:#333}
.ok{fill:#2e7d32}.mal{fill:#c62828}.b{font-weight:700}
</style><rect width="100%" height="100%" fill="#fff"/><text x="20" y="34" class="t">¿Por qué se imprime de canto?</text><polygon points="40.0,330.0 192.0,330.0 116.0,205.8" fill="#8e6bb3" stroke="#3b2560" stroke-width="2"/><polygon points="160.0,330.0 312.0,330.0 236.0,205.8" fill="#8e6bb3" stroke="#3b2560" stroke-width="2"/><polygon points="100.0,232.1 252.0,232.1 176.0,107.9" fill="#8e6bb3" stroke="#3b2560" stroke-width="2"/><polygon points="132.0,232.1 220.0,232.1 176.0,303.9" fill="#fff" stroke="#3b2560" stroke-width="1.5"/><line x1="132.0" y1="232.07999999999998" x2="220.0" y2="232.07999999999998" stroke="#c62828" stroke-width="6"/><line x1="25" y1="330" x2="327" y2="330" stroke="#555" stroke-width="3"/><text x="332" y="226.07999999999998" class="s mal b">Esta cara mira</text><text x="332" y="246.07999999999998" class="s mal b">hacia abajo y está</text><text x="332" y="266.08" class="s mal b">en el aire</text><text x="40" y="364" class="n b">Tumbado (apoyado en una cara)</text><text x="40" y="388" class="s mal">Necesitaría soportes dentro de los huecos,</text><text x="40" y="408" class="s mal">y no se podrían quitar.</text><polygon points="480.0,137.7 752.0,137.7 616.0,330.0" fill="#8e6bb3" stroke="#3b2560" stroke-width="2"/><polygon points="616.0,137.7 569.6,211.3 662.4,211.3" fill="#fff" stroke="#3b2560" stroke-width="1.5"/><polygon points="587.7,290.0 644.3,290.0 616.0,330.0" fill="#e6e6e6" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/><text x="546.0" y="332" class="s" style="fill:#777">se quita</text><line x1="465" y1="290.0" x2="712" y2="290.0" stroke="#555" stroke-width="3"/><text x="465" y="282.0" class="s" style="fill:#777">cama</text><line x1="630.0" y1="290.0" x2="738" y2="292.0" stroke="#c62828" stroke-width="1.5"/><text x="742" y="296.0" class="s b mal">Recorte de 2,5 mm:</text><text x="742" y="316.0" class="s">queda una tira plana</text><text x="742" y="336.0" class="s">que se pega a la cama</text><text x="742" y="187.66695551725908" class="s ok b">Todas las caras</text><text x="742" y="207.66695551725908" class="s ok b">inclinadas: nada</text><text x="742" y="227.66695551725908" class="s ok b">en el aire</text><text x="480" y="364" class="n b">De canto (apoyado en una arista)</text><text x="480" y="388" class="s ok">Se imprime sin soportes.</text><text x="480" y="408" class="s">Visto de lado parece una V.</text></svg>