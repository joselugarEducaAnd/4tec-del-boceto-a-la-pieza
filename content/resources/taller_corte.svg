<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510"><style>text{font-family:Arial;font-size:19px;fill:#25243f}.small{font-size:16px}.title{font-size:25px;font-weight:bold}.ok{fill:#196543}.bad{fill:#a22828}</style><rect width="960" height="510" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#453f93"/></marker></defs><text x="20" y="35" class="title">Corte con sierra manual · vista superior esquemática</text><text x="30" y="78" class="ok">CORRECTO: la fijación sostiene la pieza</text><text x="510" y="78" class="bad">INCORRECTO: la mano está en la salida</text><rect x="30" y="115" width="140" height="230" fill="#ddd"/><rect x="240" y="115" width="180" height="230" fill="#ddd"/><text x="175" y="390" class="small">Salida libre bajo la hoja</text><rect x="65" y="155" width="365" height="130" fill="#edc8a8" stroke="#98623c"/><rect x="85" y="133" width="27" height="175" fill="#666"/><rect x="305" y="133" width="27" height="175" fill="#666"/><text x="50" y="365">Gatos + apoyo estable</text><path d="M205,100 V365" stroke="#453f93" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#a)"/><rect x="199" y="142" width="12" height="125" fill="#a8b5c2"/><rect x="192" y="105" width="26" height="43" rx="6" fill="#874120"/><g transform="translate(182 99) scale(.6)"><path d="M0,28 L-5,5 Q-4,-3 2,1 L8,16 L9,-10 Q13,-17 17,-10 L18,11 L22,-15 Q28,-20 30,-12 L29,13 L34,-8 Q41,-13 42,-4 L39,20 L45,5 Q51,1 53,9 L45,38 Q25,57 9,45 Z" fill="#e8bd9c" stroke="#5d463e" stroke-width="2"/></g><g transform="translate(385 100) scale(.6)"><path d="M0,28 L-5,5 Q-4,-3 2,1 L8,16 L9,-10 Q13,-17 17,-10 L18,11 L22,-15 Q28,-20 30,-12 L29,13 L34,-8 Q41,-13 42,-4 L39,20 L45,5 Q51,1 53,9 L45,38 Q25,57 9,45 Z" fill="#e8bd9c" stroke="#5d463e" stroke-width="2"/></g><text x="220" y="108" class="small">Mano en el mango</text><text x="270" y="328" class="small">Otra mano fuera</text><rect x="540" y="155" width="365" height="130" fill="#edc8a8"/><path d="M700,110 V350" stroke="#a22828" stroke-width="4" stroke-dasharray="8 5"/><g transform="translate(685 310)"><path d="M0,28 L-5,5 Q-4,-3 2,1 L8,16 L9,-10 Q13,-17 17,-10 L18,11 L22,-15 Q28,-20 30,-12 L29,13 L34,-8 Q41,-13 42,-4 L39,20 L45,5 Q51,1 53,9 L45,38 Q25,57 9,45 Z" fill="#e8bd9c" stroke="#5d463e" stroke-width="2"/></g><path d="M640,300 L770,380 M770,300 L640,380" stroke="#a22828" stroke-width="5"/><text x="550" y="125" class="small">Un resbalón alcanza los dedos</text><text x="20" y="414">Antes: comprobar apoyo, gatos, hoja, salida libre y gafas si hay proyecciones.</text><text x="20" y="442">Ensayar el recorrido sin cortar: no debe alcanzar mesa, fijación, cuerpo ni mano.</text><text x="20" y="470">El docente demuestra la sierra disponible; este esquema no sustituye esa demostración.</text></svg>