 font-weight="700" font-size="14" style="fill:#fff">Total</text><rect x="40" y="106" width="175" height="52" fill="#f8ede6" stroke="#9c4419" stroke-width="1"/><rect x="215" y="106" width="125" height="52" fill="#f8ede6" stroke="#9c4419" stroke-width="1"/><rect x="340" y="106" width="170" height="52" fill="#f8ede6" stroke="#9c4419" stroke-width="1"/><rect x="510" y="106" width="90" height="52" fill="#f8ede6" stroke="#9c4419" stroke-width="1"/><rect x="600" y="106" width="145" height="52" fill="#f8ede6" stroke="#9c4419" stroke-width="1"/><rect x="745" y="106" width="135" height="52" fill="#f8ede6" stroke="#9c4419" stroke-width="1"/><rect x="880" y="106" width="90" height="52" fill="#f8ede6" stroke="#9c4419" stroke-width="1"/><text class="s" x="50" y="138" font-weight="700">PLA</text><text class="s" x="277.5" y="138" text-anchor="middle">4 × 3 = 12</text><text class="s" x="425.0" y="138" text-anchor="middle">5 × 2 = 10</text><text class="s" x="555.0" y="138" text-anchor="middle">4 × 1 = 4</text><text class="s" x="672.5" y="138" text-anchor="middle">2 × 2 = 4</text><text class="s" x="812.5" y="138" text-anchor="middle">3 × 1 = 3</text><text class="t" x="925.0" y="140" text-anchor="middle" font-size="21">33</text><rect x="40" y="158" width="175" height="52" fill="#fff" stroke="#9c4419" stroke-width="1"/><rect x="215" y="158" width="125" height="52" fill="#fff" stroke="#9c4419" stroke-width="1"/><rect x="340" y="158" width="170" height="52" fill="#fff" stroke="#9c4419" stroke-width="1"/><rect x="510" y="158" width="90" height="52" fill="#fff" stroke="#9c4419" stroke-width="1"/><rect x="600" y="158" width="145" height="52" fill="#fff" stroke="#9c4419" stroke-width="1"/><rect x="745" y="158" width="135" height="52" fill="#fff" stroke="#9c4419" stroke-width="1"/><rect x="880" y="158" width="90" height="52" fill="#fff" stroke="#9c4419" stroke-width="1"/><text class="s" x="50" y="190" font-weight="700">Contrachapado</text><text class="s" x="277.5" y="190" text-anchor="middle">5 × 3 = 15</text><text class="s" x="425.0" y="190" text-anchor="middle">2 × 2 = 4</text><text class="s" x="555.0" y="190" text-anchor="middle">4 × 1 = 4</text><text class="s" x="672.5" y="190" text-anchor="middle">3 × 2 = 6</text><text class="s" x="812.5" y="190" text-anchor="middle">1 × 1 = 1</text><text class="t" x="925.0" y="192" text-anchor="middle" font-size="21">30</text><rect x="40" y="210" width="175" height="52" fill="#f8ede6" stroke="#9c4419" stroke-width="1"/><rect x="215" y="210" width="125" height="52" fill="#f8ede6" stroke="#9c4419" stroke-width="1"/><rect x="340" y="210" width="170" height="52" fill="#f8ede6" stroke="#9c4419" stroke-width="1"/><rect x="510" y="210" width="90" height="52" fill="#f8ede6" stroke="#9c4419" stroke-width="1"/><rect x="600" y="210" width="145" height="52" fill="#f8ede6" stroke="#9c4419" stroke-width="1"/><rect x="745" y="210" width="135" height="52" fill="#f8ede6" stroke="#9c4419" stroke-width="1"/><rect x="880" y="210" width="90" height="52" fill="#f8ede6" stroke="#9c4419" stroke-width="1"/><text class="s" x="50" y="242" font-weight="700">Cartón pluma</text><text class="s" x="277.5" y="242" text-anchor="middle">1 × 3 = 3</text><text class="s" x="425.0" y="242" text-anchor="middle">5 × 2 = 10</text><text class="s" x="555.0" y="242" text-anchor="middle">5 × 1 = 5</text><text class="s" x="672.5" y="242" text-anchor="middle">1 × 2 = 2</text><text class="s" x="812.5" y="242" text-anchor="middle">1 × 1 = 1</text><text class="t" x="925.0" y="244" text-anchor="middle" font-size="21">21</text><text class="c" x="40" y="290">Gana el PLA: la forma en C es fácil de imprimir y difícil de cortar y encolar.</text><text class="c" x="40" y="310">Condición que impone: imprimir de pie, con los esfuerzos a lo largo de las capas.</text></svg>