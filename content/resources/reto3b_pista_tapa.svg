<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="Corte de la caja con la tapa montada: la pestaña entra 4 milímetros en la caja; un separador que llega hasta arriba choca con ella y otro más bajo, que deja 1 milímetro de aire, cabe. La altura del separador está por calcular." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>text{font-family:Verdana,'DejaVu Sans',Arial,sans-serif;fill:#25243f} .t{font-size:23px;font-weight:700} .s{font-size:17px} .c{font-size:15px;fill:#1b4d7e} .q{font-size:17px;font-weight:700;fill:#b3261e} .n{font-size:15px} .cota{stroke:#1b4d7e;stroke-width:1.5;fill:none;marker-start:url(#c1);marker-end:url(#c2)} .aux{stroke:#1b4d7e;stroke-width:1;fill:none} .eje{stroke:#1b4d7e;stroke-width:1;stroke-dasharray:10 3 2 3;fill:none} .pieza{fill:#e9e9ec;stroke:#25243f;stroke-width:2.5} .hueco{fill:#fff;stroke:#25243f;stroke-width:2.5} .oculta{stroke:#25243f;stroke-width:1.5;stroke-dasharray:6 4;fill:none} .corte{fill:url(#rayado);stroke:#25243f;stroke-width:2.5} .pa{fill:#4a90d9;fill-opacity:.35;stroke:#1f5fa8;stroke-width:2} .pb{fill:#43a047;fill-opacity:.35;stroke:#2e7d32;stroke-width:2} .pc{fill:#f39c12;fill-opacity:.45;stroke:#c77700;stroke-width:2} .ph{fill:#9e9e9e;fill-opacity:.35;stroke:#616161;stroke-width:2;stroke-dasharray:5 3} .mal{fill:#e53935;fill-opacity:.55;stroke:#b3261e;stroke-width:2}</style><defs><marker id="c1" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M9,0 L9,6 L0,3 z" fill="#1b4d7e"/></marker><marker id="c2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1b4d7e"/></marker><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e9e9ec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#25243f" stroke-width="1.2"/></pattern></defs><text class="t" x="20.0" y="40.0">Pista 2 · ¿Hasta dónde puede subir un separador?</text><text class="s" x="20.0" y="68.0">Corte de la caja con la tapa puesta (medidas en mm).</text><rect class="corte" x="120.0" y="141.0" width="14.0" height="175.0"/><rect class="corte" x="456.0" y="141.0" width="14.0" height="175.0"/><rect class="corte" x="120.0" y="302.0" width="350.0" height="14.0"/><rect class="pc" x="120.0" y="120.0" width="350.0" height="21.0"/><rect class="pc" x="136.1" y="141.0" width="317.8" height="28.0"/><rect class="mal" x="232.0" y="141.0" width="14.0" height="161.0"/><rect class="pieza" x="344.0" y="176.0" width="14.0" height="126.0"/><text class="q" x="239.0" y="346.0" text-anchor="middle">✗ choca</text><text class="c" x="351.0" y="346.0" text-anchor="middle">✓ cabe</text><line class="cota" x1="500.0" y1="141.0" x2="500.0" y2="169.0"/><text class="c" x="510.0" y="160.0">4 (pestaña)</text><line class="aux" x1="456.0" y1="141.0" x2="506.0" y2="141.0"/><line class="aux" x1="456.0" y1="169.0" x2="506.0" y2="169.0"/><line class="cota" x1="620.0" y1="141.0" x2="620.0" y2="316.0"/><text class="c" x="630.0" y="233.5">25</text><line class="aux" x1="474.0" y1="141.0" x2="626.0" y2="141.0"/><line class="aux" x1="474.0" y1="316.0" x2="626.0" y2="316.0"/><line class="cota" x1="90.0" y1="176.0" x2="90.0" y2="302.0"/><text class="q" x="80.0" y="244.0" text-anchor="end">?</text><line class="aux" x1="344.0" y1="176.0" x2="84.0" y2="176.0"/><line class="aux" x1="344.0" y1="302.0" x2="84.0" y2="302.0"/><text class="n" x="660.0" y="180.0">Naranja: la tapa (placa + pestaña).</text><text class="n" x="660.0" y="204.0">La pestaña entra 4 mm en la caja.</text><text class="n" x="660.0" y="244.0">Rojo: un separador que llega arriba</text><text class="n" x="660.0" y="268.0">del todo choca con la pestaña.</text><text class="n" x="660.0" y="308.0">Deja 1 mm de aire bajo la pestaña.</text><text class="n" x="660.0" y="332.0">¿Qué altura le das y con qué elevación?</text></svg>