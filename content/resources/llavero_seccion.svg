<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img"><title>Llavero: 4 + 3 = 7 mm</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8Z" fill="#453f93"/></marker><pattern id="capas" width="8" height="10" patternUnits="userSpaceOnUse"><rect width="8" height="10" fill="#eec9ad"/><path d="M0 9H8" stroke="#9c4419"/></pattern></defs><style>text{font-family:Arial,sans-serif;fill:#252525;font-size:18px}.titulo{font-size:25px;font-weight:bold}.small{font-size:15px}.pieza{fill:#eec9ad;stroke:#9c4419;stroke-width:2}.hueco{fill:#e7f2fa;stroke:#367da5;stroke-width:2;stroke-dasharray:6 4}.cota{fill:none;stroke:#453f93;stroke-width:2;marker-start:url(#arr);marker-end:url(#arr)}.flecha{fill:none;stroke:#453f93;stroke-width:3;marker-end:url(#arr)}.mal{fill:#fde5e3;stroke:#a32929;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="25" y="36" class="titulo">Llavero: 4 + 3 = 7 mm</text><rect x="40" y="220" width="360" height="60" class="pieza"/><rect x="160" y="175" width="110" height="45" class="pieza"/><text x="45" y="135" class="">CORRECTO: letra en Z=4</text><path d="M420 175V280" class="cota"/><text x="430" y="228" class="">7</text><text x="160" y="204" class="">3 mm</text><text x="160" y="258" class="">4 mm</text><rect x="540" y="220" width="300" height="60" class="pieza"/><rect x="635" y="160" width="100" height="45" class="pieza"/><text x="540" y="135" class="">INCORRECTO: letra en Z=5</text><text x="605" y="312" class="">1 mm de aire bajo la letra</text><path d="M690 300V214" class="flecha"/><text x="45" y="370" class="">Una selección conjunta no elimina el espacio entre volúmenes.</text></svg>