<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Despiece de la placa redondeada: un cubo azul de 60 por un ancho por calcular, un cubo verde de un largo por calcular por 30, y cuatro cilindros naranjas de diámetro 10 centrados en los agujeros." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>text{font-family:Verdana,'DejaVu Sans',Arial,sans-serif;fill:#25243f} .t{font-size:23px;font-weight:700} .s{font-size:17px} .c{font-size:15px;fill:#1b4d7e} .q{font-size:17px;font-weight:700;fill:#b3261e} .n{font-size:15px} .cota{stroke:#1b4d7e;stroke-width:1.5;fill:none;marker-start:url(#c1);marker-end:url(#c2)} .aux{stroke:#1b4d7e;stroke-width:1;fill:none} .eje{stroke:#1b4d7e;stroke-width:1;stroke-dasharray:10 3 2 3;fill:none} .pieza{fill:#e9e9ec;stroke:#25243f;stroke-width:2.5} .hueco{fill:#fff;stroke:#25243f;stroke-width:2.5} .oculta{stroke:#25243f;stroke-width:1.5;stroke-dasharray:6 4;fill:none} .corte{fill:url(#rayado);stroke:#25243f;stroke-width:2.5} .pa{fill:#4a90d9;fill-opacity:.35;stroke:#1f5fa8;stroke-width:2} .pb{fill:#43a047;fill-opacity:.35;stroke:#2e7d32;stroke-width:2} .pc{fill:#f39c12;fill-opacity:.45;stroke:#c77700;stroke-width:2} .ph{fill:#9e9e9e;fill-opacity:.35;stroke:#616161;stroke-width:2;stroke-dasharray:5 3} .mal{fill:#e53935;fill-opacity:.55;stroke:#b3261e;stroke-width:2}</style><defs><marker id="c1" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M9,0 L9,6 L0,3 z" fill="#1b4d7e"/></marker><marker id="c2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1b4d7e"/></marker><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e9e9ec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#25243f" stroke-width="1.2"/></pattern></defs><text class="t" x="20.0" y="40.0">Pista 2 · Despiece de la placa redondeada</text><text class="s" x="20.0" y="68.0">Vista superior. Las tres formas se agrupan: juntas forman la placa.</text><rect class="pa" x="120.0" y="170.0" width="360.0" height="120.0"/><rect class="pb" x="150.0" y="140.0" width="300.0" height="180.0"/><circle class="pc" cx="150.0" cy="170.0" r="30.0"/><line class="aux" x1="141.0" y1="170.0" x2="159.0" y2="170.0"/><line class="aux" x1="150.0" y1="161.0" x2="150.0" y2="179.0"/><circle class="pc" cx="150.0" cy="290.0" r="30.0"/><line class="aux" x1="141.0" y1="290.0" x2="159.0" y2="290.0"/><line class="aux" x1="150.0" y1="281.0" x2="150.0" y2="299.0"/><circle class="pc" cx="450.0" cy="170.0" r="30.0"/><line class="aux" x1="441.0" y1="170.0" x2="459.0" y2="170.0"/><line class="aux" x1="450.0" y1="161.0" x2="450.0" y2="179.0"/><circle class="pc" cx="450.0" cy="290.0" r="30.0"/><line class="aux" x1="441.0" y1="290.0" x2="459.0" y2="290.0"/><line class="aux" x1="450.0" y1="281.0" x2="450.0" y2="299.0"/><line class="cota" x1="120.0" y1="112.0" x2="480.0" y2="112.0"/><text class="c" x="300.0" y="104.0" text-anchor="middle">60</text><line class="aux" x1="120.0" y1="134.0" x2="120.0" y2="118.0"/><line class="aux" x1="480.0" y1="134.0" x2="480.0" y2="118.0"/><line class="cota" x1="560.0" y1="140.0" x2="560.0" y2="320.0"/><text class="c" x="570.0" y="235.0">30</text><line class="aux" x1="486.0" y1="140.0" x2="566.0" y2="140.0"/><line class="aux" x1="486.0" y1="320.0" x2="566.0" y2="320.0"/><line class="cota" x1="520.0" y1="170.0" x2="520.0" y2="290.0"/><text class="q" x="530.0" y="235.0">?</text><line class="aux" x1="486.0" y1="170.0" x2="526.0" y2="170.0"/><line class="aux" x1="486.0" y1="290.0" x2="526.0" y2="290.0"/><line class="cota" x1="150.0" y1="372.0" x2="450.0" y2="372.0"/><text class="q" x="300.0" y="364.0" text-anchor="middle">?</text><line class="aux" x1="150.0" y1="326.0" x2="150.0" y2="366.0"/><line class="aux" x1="450.0" y1="326.0" x2="450.0" y2="366.0"/><line class="aux" x1="471.0" y1="311.0" x2="560.0" y2="380.0"/><text class="c" x="564.0" y="392.0">Ø10 (×4), centro = centro del agujero</text><text class="n" x="600.0" y="170.0">Azul: un cubo de 60 × ?</text><text class="n" x="600.0" y="198.0">Verde: un cubo de ? × 30</text><text class="n" x="600.0" y="226.0">Naranja: 4 cilindros de Ø10</text><text class="n" x="600.0" y="266.0">¿Cuánto miden los dos cubos para</text><text class="n" x="600.0" y="288.0">que el conjunto siga midiendo 60 × 30</text><text class="n" x="600.0" y="310.0">y las esquinas queden redondas?</text></svg>