<style>text{font-family:Verdana,'DejaVu Sans',Arial,sans-serif;fill:#25243f} .t{font-size:23px;font-weight:700} .s{font-size:17px} .c{font-size:15px;fill:#1b4d7e} .box{fill:#f8ede6;stroke:#9c4419;stroke-width:3} .arr{stroke:#9c4419;stroke-width:4;fill:none;marker-end:url(#a)} .cota{stroke:#1b4d7e;stroke-width:1.5;fill:none;marker-start:url(#c1);marker-end:url(#c2)} .aux{stroke:#1b4d7e;stroke-width:1;fill:none} .pieza{fill:#e9e9ec;stroke:#25243f;stroke-width:2.5} .hueco{fill:#fff;stroke:#25243f;stroke-width:2.5} .oculta{stroke:#25243f;stroke-width:1.5;stroke-dasharray:6 4;fill:none}</style>
