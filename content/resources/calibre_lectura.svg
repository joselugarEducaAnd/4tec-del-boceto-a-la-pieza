xt><path d="M271.5 199V240" stroke="#453f93" stroke-width="2"/><text x="264.5" y="262" font-size="18">3</text><path d="M330.0 199V240" stroke="#c02929" stroke-width="4"/><text x="323.0" y="262" font-size="18">4</text><path d="M388.5 199V240" stroke="#453f93" stroke-width="2"/><text x="381.5" y="262" font-size="18">5</text><path d="M447.00000000000006 199V240" stroke="#453f93" stroke-width="2"/><text x="440.00000000000006" y="262" font-size="18">6</text><path d="M505.5 199V240" stroke="#453f93" stroke-width="2"/><text x="498.5" y="262" font-size="18">7</text><path d="M564.0 199V240" stroke="#453f93" stroke-width="2"/><text x="557.0" y="262" font-size="18">8</text><path d="M622.5 199V240" stroke="#453f93" stroke-width="2"/><text x="615.5" y="262" font-size="18">9</text><path d="M681.0 199V240" stroke="#453f93" stroke-width="2"/><text x="674.0" y="262" font-size="18">10</text><path d="M330 140V285" stroke="#c02929" stroke-dasharray="5 4"/><text x="345" y="310" font-size="19">4.ª raya del nonio coincide con la escala principal</text><text x="30" y="350" font-size="20">1. Antes del cero del nonio: 12 mm.</text><text x="30" y="386" font-size="20">2. Coincide la raya 4: añade 4 × 0,1 = 0,4 mm.</text><text x="30" y="422" font-size="23" font-weight="bold">Lectura: 12,4 mm.</text><text x="30" y="468" font-size="18">Cierra suave, limpia y comprueba el cero antes de medir.</text><text x="30" y="502" font-size="18">Lee la resolución de tu calibre; no todos usan este nonio.</text></g></svg>