<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img"><title>Tamaño y posición no son lo mismo</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8Z" fill="#453f93"/></marker><pattern id="capas" width="8" height="10" patternUnits="userSpaceOnUse"><rect width="8" height="10" fill="#eec9ad"/><path d="M0 9H8" stroke="#9c4419"/></pattern></defs><style>text{font-family:Arial,sans-serif;fill:#252525;font-size:18px}.titulo{font-size:25px;font-weight:bold}.small{font-size:15px}.pieza{fill:#eec9ad;stroke:#9c4419;stroke-width:2}.hueco{fill:#e7f2fa;stroke:#367da5;stroke-width:2;stroke-dasharray:6 4}.cota{fill:none;stroke:#453f93;stroke-width:2;marker-start:url(#arr);marker-end:url(#arr)}.flecha{fill:none;stroke:#453f93;stroke-width:3;marker-end:url(#arr)}.mal{fill:#fde5e3;stroke:#a32929;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="25" y="36" class="titulo">Tamaño y posición no son lo mismo</text><rect x="110" y="160" width="300" height="50" class="pieza"/><text x="120" y="145" class="">Placa: X=40 · Y=25 · Z=4 mm</text><text x="115" y="235" class="">Base en Z=0; cara superior en Z=4</text><path d="M110 300H410 M110 300V90 M110 300L45 350" class="flecha"/><text x="420" y="305" class="">X</text><text x="100" y="80" class="">Z</text><text x="30" y="375" class="">Y</text><rect x="540" y="130" width="300" height="50" class="pieza"/><text x="550" y="110" class="">Mismo tamaño, elevada 3 mm</text><path d="M540 215H845" stroke="#333" stroke-dasharray="5 5"/><text x="550" y="242" class="">Base en Z=3; superior en Z=7</text><text x="540" y="300" class="">Grosor: 4 mm, no 7 mm.</text><text x="540" y="335" class="">La distancia al plano es otra cota.</text></svg>