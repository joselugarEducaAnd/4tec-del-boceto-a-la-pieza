<svg xmlns="http://www.w3.org/2000/svg" width="930" height="335" viewBox="0 0 930 335" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Cómo se unen dos tetraedros</title><desc id="d">Tres parejas de tetraedros separados 7,5 mm. Con arista 7,5 solo se tocan en un punto; con 8,5 se meten 1 mm y la unión es muy débil; con 9,5 se meten 2 mm y la unión aguanta.</desc><style>
.t{font:700 22px sans-serif;fill:#3a2a20}.n{font:17px sans-serif;fill:#222}.s{font:15px sans-serif;fill:#333}
.ok{fill:#2e7d32}.mal{fill:#c62828}.b{font-weight:700}
</style><rect width="100%" height="100%" fill="#fff"/><text x="20" y="34" class="t">Cómo se unen dos tetraedros (a la misma escala)</text><text x="20" y="60" class="s">Separación 7,5 mm en los tres casos. Lo que cambia es la arista.</text><polygon points="20.0,200 102.5,200 61.2,128.6" fill="#8e6bb3" stroke="#3b2560" stroke-width="2"/><polygon points="102.5,200 185.0,200 143.8,128.6" fill="#8e6bb3" stroke="#3b2560" stroke-width="2" fill-opacity=".85"/><circle cx="102.5" cy="196" r="34" fill="none" stroke="#c62828" stroke-width="3"/><text x="25" y="248" class="n b">Arista 7,5: se tocan en un punto</text><text x="25" y="272" class="s mal">Así no: sale en trozos</text><polygon points="330.0,200 423.5,200 376.8,119.0" fill="#8e6bb3" stroke="#3b2560" stroke-width="2"/><polygon points="412.5,200 506.0,200 459.2,119.0" fill="#8e6bb3" stroke="#3b2560" stroke-width="2" fill-opacity=".85"/><polygon points="412.5,200 423.5,200 418.0,190.5" fill="#e08a00" stroke="#e08a00" stroke-width="2"/><circle cx="418.0" cy="196" r="34" fill="none" stroke="#e08a00" stroke-width="3"/><text x="335" y="248" class="n b">Arista 8,5: se meten 1 mm</text><text x="335" y="272" class="s mal">Muy débil: se parte al cogerla</text><polygon points="640.0,200 744.5,200 692.2,109.5" fill="#8e6bb3" stroke="#3b2560" stroke-width="2"/><polygon points="722.5,200 827.0,200 774.8,109.5" fill="#8e6bb3" stroke="#3b2560" stroke-width="2" fill-opacity=".85"/><polygon points="722.5,200 744.5,200 733.5,180.9" fill="#2e7d32" stroke="#2e7d32" stroke-width="2"/><circle cx="733.5" cy="196" r="34" fill="none" stroke="#2e7d32" stroke-width="3"/><text x="645" y="248" class="n b">Arista 9,5: se meten 2 mm</text><text x="645" y="272" class="s ok">Así sí: una sola pieza que aguanta</text><text x="20" y="315" class="s">La zona de color es la parte que comparten. Cuanto más grande, más fuerte es la unión.</text></svg>