ra ancha descansa en la bandeja.</text><text x="530" y="85" class="">B · giro de 90°; perfil C en XZ</text><text x="530" y="113" class="small">Misma C: altura 45,5 mm; profundidad 10 mm.</text><text x="30" y="375" class="small">Cada capa reproduce la C completa.</text><text x="30" y="400" class="small">Las líneas del canto indican capas apiladas.</text><text x="530" y="375" class="small">El brazo superior sobresale sobre el hueco.</text><text x="530" y="400" class="small">Azul discontinuo: zona que puede requerir soporte.</text><path d="M25 430H975" stroke="#bbb"/><text x="25" y="465" class="title">Posición de uso y carga (separada de la posición de impresión)</text><path d="M95 525H345V575H145V702H345V752H95Z" fill="#f4cfaa" stroke="#8a451e" stroke-width="3"/><rect x="148" y="577" width="530" height="122" fill="#ccd2da" stroke="#5e6775" stroke-width="2"/><path d="M315 753V795" stroke="#453f93" stroke-width="4" marker-end="url(#arr)"/><text x="400" y="625" class="">Tablero fijado: entra por la abertura</text><text x="400" y="652" class="small">Espesor menor que el hueco de 25,5 mm</text><text x="370" y="760" class="small">Carga hacia abajo en el brazo libre</text><text x="370" y="790" class="small">Ni esta orientación ni el dibujo demuestran resistencia.</text></svg>