1="150.0" x2="930.0" y2="300.0"/><text class="c" x="940.0" y="230.0">25</text><line class="aux" x1="864.0" y1="150.0" x2="936.0" y2="150.0"/><line class="aux" x1="864.0" y1="300.0" x2="936.0" y2="300.0"/><text class="n" x="560.0" y="340.0">Muesca centrada para abrir con el dedo.</text><text class="q" x="560.0" y="380.0">Separadores: la altura la decides tú.</text><text class="q" x="560.0" y="404.0">Condición: la tapa tiene que cerrar.</text><text class="n" x="560.0" y="444.0">Tapa: la misma de la Fase A.</text></svg>