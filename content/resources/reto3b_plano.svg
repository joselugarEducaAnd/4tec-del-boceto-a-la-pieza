<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="Plano del reto 3, fase B: caja de 50 por 40 con dos separadores de 2 milímetros que forman tres compartimentos iguales y una muesca de 16 por 5 centrada en lo alto de la pared delantera; la altura de los separadores no se da: la tapa tiene que cerrar." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>text{font-family:Verdana,'DejaVu Sans',Arial,sans-serif;fill:#25243f} .t{font-size:23px;font-weight:700} .s{font-size:17px} .c{font-size:15px;fill:#1b4d7e} .q{font-size:17px;font-weight:700;fill:#b3261e} .n{font-size:15px} .cota{stroke:#1b4d7e;stroke-width:1.5;fill:none;marker-start:url(#c1);marker-end:url(#c2)} .aux{stroke:#1b4d7e;stroke-width:1;fill:none} .eje{stroke:#1b4d7e;stroke-width:1;stroke-dasharray:10 3 2 3;fill:none} .pieza{fill:#e9e9ec;stroke:#25243f;stroke-width:2.5} .hueco{fill:#fff;stroke:#25243f;stroke-width:2.5} .oculta{stroke:#25243f;stroke-width:1.5;stroke-dasharray:6 4;fill:none} .corte{fill:url(#rayado);stroke:#25243f;stroke-width:2.5} .pa{fill:#4a90d9;fill-opacity:.35;stroke:#1f5fa8;stroke-width:2} .pb{fill:#43a047;fill-opacity:.35;stroke:#2e7d32;stroke-width:2} .pc{fill:#f39c12;fill-opacity:.45;stroke:#c77700;stroke-width:2} .ph{fill:#9e9e9e;fill-opacity:.35;stroke:#616161;stroke-width:2;stroke-dasharray:5 3} .mal{fill:#e53935;fill-opacity:.55;stroke:#b3261e;stroke-width:2}</style><defs><marker id="c1" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M9,0 L9,6 L0,3 z" fill="#1b4d7e"/></marker><marker id="c2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1b4d7e"/></marker><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e9e9ec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#25243f" stroke-width="1.2"/></pattern></defs><text class="t" x="20.0" y="40.0">Re