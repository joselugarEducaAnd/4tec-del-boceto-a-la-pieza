<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510"><style>text{font-family:Arial;font-size:19px;fill:#25243f}.small{font-size:16px}.title{font-size:25px;font-weight:bold}.ok{fill:#196543}.bad{fill:#a22828}</style><rect width="960" height="510" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#453f93"/></marker></defs><text x="20" y="35" class="title">Taladro de columna · comprobar antes de accionar</text><rect x="100" y="320" width="380" height="18" fill="#888"/><rect x="180" y="270" width="215" height="28" fill="#edc8a8" stroke="#98623c"/><rect x="180" y="298" width="215" height="18" fill="#c18b5c"/><path d="M165,265 V327 H410 V265" fill="none" stroke="#555" stroke-width="16"/><text x="45" y="365">Mordaza fijada a la mesa + apoyo de sacrificio</text><rect x="256" y="105" width="54" height="55" fill="#555"/><path d="M275,160 L285,240 L295,160 Z" fill="#aaa" stroke="#333"/><rect x="235" y="170" width="90" height="90" rx="10" fill="#dff5ff" fill-opacity=".4" stroke="#33869b" stroke-dasharray="6"/><path d="M350,167 V242" stroke="#453f93" stroke-width="4" marker-end="url(#a)"/><path d="M310,130 L430,100" stroke="#555" stroke-width="6"/><g transform="translate(423 80) scale(.7)"><path d="M0,28 L-5,5 Q-4,-3 2,1 L8,16 L9,-10 Q13,-17 17,-10 L18,11 L22,-15 Q28,-20 30,-12 L29,13 L34,-8 Q41,-13 42,-4 L39,20 L45,5 Q51,1 53,9 L45,38 Q25,57 9,45 Z" fill="#e8bd9c" stroke="#5d463e" stroke-width="2"/></g><text x="485" y="112">Mano en el mando de avance</text><text x="485" y="155">La otra mano: zona de mando segura</text><text x="485" y="198">Resguardo según la máquina</text><text x="485" y="241" class="bad">Nunca agarrar la pieza para frenar su giro</text><text x="485" y="284" class="bad">Sin guantes, pelo ni ropa suelta junto al giro</text><text x="20" y="414">Antes: broca adecuada, llave retirada, resguardo, gafas y fijación contra el giro.</text><text x="20" y="442">No ajustar ni retirar virutas en marcha. Esperar a la parada completa y usar cepillo.</text><text x="20" y="470">Si la pieza se mueve, detener y avisar; no intentar sujetarla con los dedos.</text></svg>