<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Holgura: reparte la diferencia entre los dos lados</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8Z" fill="#453f93"/></marker><pattern id="capas" width="8" height="10" patternUnits="userSpaceOnUse"><rect width="8" height="10" fill="#eec9ad"/><path d="M0 9H8" stroke="#9c4419"/></pattern></defs><style>text{font-family:Arial,sans-serif;fill:#252525;font-size:18px}.titulo{font-size:25px;font-weight:bold}.small{font-size:15px}.pieza{fill:#eec9ad;stroke:#9c4419;stroke-width:2}.hueco{fill:#e7f2fa;stroke:#367da5;stroke-width:2;stroke-dasharray:6 4}.cota{fill:none;stroke:#453f93;stroke-width:2;marker-start:url(#arr);marker-end:url(#arr)}.flecha{fill:none;stroke:#453f93;stroke-width:3;marker-end:url(#arr)}.mal{fill:#fde5e3;stroke:#a32929;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="25" y="36" class="titulo">Holgura: reparte la diferencia entre los dos lados</text><rect x="65" y="125" width="770" height="170" class="pieza"/><rect x="100" y="105" width="700" height="155" class="hueco"/><rect x="115" y="105" width="670" height="70" class="pieza"/><text x="295" y="155" class="">Pestaña: 45,4 mm</text><path d="M100 325H800" class="cota"/><text x="350" y="355" class="">Hueco: 46 mm</text><text x="94" y="92" class="">0,3</text><text x="779" y="92" class="">0,3</text><path d="M107.5 97V130 M792.5 97V130" stroke="#453f93" stroke-width="1.5"/><text x="160" y="378" class="small">Holgura exagerada en el dibujo para que se vea.</text><text x="160" y="403" class="">(46 − 45,4) / 2 = 0,3 mm por lado · dimensiones nominales</text></svg>