<svg xmlns="http://www.w3.org/2000/svg" width="930" height="460" viewBox="0 0 930 460" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Árbol de Pitágoras nivel a nivel</title><desc id="d">Vista desde arriba de los niveles 2, 3 y 6 del árbol de Pitágoras. Cada nivel es un cuadrado nuevo (naranja) con dos copias del nivel anterior encima: una girada +45° a la izquierda (verde) y otra girada −45° a la derecha (azul). Las cajas discontinuas son las que muestra Tinkercad.</desc><style>
