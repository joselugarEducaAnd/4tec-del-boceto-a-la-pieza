<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-label="Corte de un agujero avellanado: placa de 4, agujero de diámetro 4 y un cono hueco con la base a elevación 2 que se abre a 45 grados y sobresale 1 milímetro por encima de la placa; los radios y la altura del cono están por calcular." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>text{font-family:Verdana,'DejaVu Sans',Arial,sans-serif;fill:#25243f} .t{font-size:23px;font-weight:700} .s{font-size:17px} .c{font-size:15px;fill:#1b4d7e} .q{font-size:17px;font-weight:700;fill:#b3261e} .n{font-size:15px} .cota{stroke:#1b4d7e;stroke-width:1.5;fill:none;marker-start:url(#c1);marker-end:url(#c2)} .aux{stroke:#1b4d7e;stroke-width:1;fill:none} .eje{stroke:#1b4d7e;stroke-width:1;stroke-dasharray:10 3 2 3;fill:none} .pieza{fill:#e9e9ec;stroke:#25243f;stroke-width:2.5} .hueco{fill:#fff;stroke:#25243f;stroke-width:2.5} .oculta{stroke:#25243f;stroke-width:1.5;stroke-dasharray:6 4;fill:none} .corte{fill:url(#rayado);stroke:#25243f;stroke-width:2.5} .pa{fill:#4a90d9;fill-opacity:.35;stroke:#1f5fa8;stroke-width:2} .pb{fill:#43a047;fill-opacity:.35;stroke:#2e7d32;stroke-width:2} .pc{fill:#f39c12;fill-opacity:.45;stroke:#c77700;stroke-width:2} .ph{fill:#9e9e9e;fill-opacity:.35;stroke:#616161;stroke-width:2;stroke-dasharray:5 3} .mal{fill:#e53935;fill-opacity:.55;stroke:#b3261e;stroke-width:2}</style><defs><marker id="c1" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M9,0 L9,6 L0,3 z" fill="#1b4d7e"/></marker><marker id="c2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1b4d7e"/></marker><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e9e9ec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#25243f" stroke-width="1.2"/></pattern></defs><text class="t" x="20.0" y="40.0">Pista 2 · El avellanado es un cono hueco</text><text class="s" x="20.0" y="68.0">Corte por un agujero. El cono gris es la forma Cono en Hueco.</text><polygon class="corte" points="174.0,180.0 228.0,180.0 264.0,216.0 264.0,252.0 174.0,252.0"/><polygon class="corte" points="426.0,180.0 372.0,180.0 336.0,216.0 336.0,252.0 426.0,252.0"/><polygon class="ph" points="264.0,216.0 336.0,216.0 390.0,162.0 210.0,162.0"/><line class="eje" x1="300.0" y1="140.0" x2="300.0" y2="272.0"/><line class="cota" x1="300.0" y1="282.0" x2="336.0" y2="282.0"/><text class="q" x="318.0" y="274.0" text-anchor="middle"></text><text class="q" x="346.0" y="287.0">radio de la base ?</text><line class="aux" x1="336.0" y1="216.0" x2="336.0" y2="288.0"/><line class="cota" x1="300.0" y1="138.0" x2="390.0" y2="138.0"/><text class="q" x="345.0" y="130.0" text-anchor="middle"></text><text class="q" x="400.0" y="143.0">radio superior ?</text><line class="aux" x1="390.0" y1="162.0" x2="390.0" y2="132.0"/><line class="cota" x1="144.0" y1="216.0" x2="144.0" y2="252.0"/><text class="c" x="134.0" y="239.0" text-anchor="end">elevación 2</text><line class="aux" x1="260.0" y1="216.0" x2="138.0" y2="216.0"/><line class="aux" x1="260.0" y1="252.0" x2="138.0" y2="252.0"/><line class="cota" x1="144.0" y1="162.0" x2="144.0" y2="216.0"/><text class="q" x="134.0" y="194.0" text-anchor="end">altura ?</text><line class="aux" x1="206.0" y1="162.0" x2="138.0" y2="162.0"/><line class="aux" x1="206.0" y1="216.0" x2="138.0" y2="216.0"/><text class="n" x="620.0" y="150.0">Pared a 45°: el radio crece 1 mm</text><text class="n" x="620.0" y="172.0">por cada mm que sube.</text><text class="n" x="620.0" y="214.0">Haz el cono 1 mm más alto que la</text><text class="n" x="620.0" y="236.0">placa: así corta seguro por arriba.</text><text class="n" x="620.0" y="278.0">En la cara de arriba tiene que</text><text class="n" x="620.0" y="300.0">quedar un círculo de Ø8.</text></svg>