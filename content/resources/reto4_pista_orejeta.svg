<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Despiece de una orejeta vista de perfil: un cubo azul de 40 de ancho y altura por calcular, un cilindro verde de diámetro 40 tumbado con su centro a 40 de la base, y el agujero gris de diámetro 8 en el mismo centro." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>text{font-family:Verdana,'DejaVu Sans',Arial,sans-serif;fill:#25243f} .t{font-size:23px;font-weight:700} .s{font-size:17px} .c{font-size:15px;fill:#1b4d7e} .q{font-size:17px;font-weight:700;fill:#b3261e} .n{font-size:15px} .cota{stroke:#1b4d7e;stroke-width:1.5;fill:none;marker-start:url(#c1);marker-end:url(#c2)} .aux{stroke:#1b4d7e;stroke-width:1;fill:none} .eje{stroke:#1b4d7e;stroke-width:1;stroke-dasharray:10 3 2 3;fill:none} .pieza{fill:#e9e9ec;stroke:#25243f;stroke-width:2.5} .hueco{fill:#fff;stroke:#25243f;stroke-width:2.5} .oculta{stroke:#25243f;stroke-width:1.5;stroke-dasharray:6 4;fill:none} .corte{fill:url(#rayado);stroke:#25243f;stroke-width:2.5} .pa{fill:#4a90d9;fill-opacity:.35;stroke:#1f5fa8;stroke-width:2} .pb{fill:#43a047;fill-opacity:.35;stroke:#2e7d32;stroke-width:2} .pc{fill:#f39c12;fill-opacity:.45;stroke:#c77700;stroke-width:2} .ph{fill:#9e9e9e;fill-opacity:.35;stroke:#616161;stroke-width:2;stroke-dasharray:5 3} .mal{fill:#e53935;fill-opacity:.55;stroke:#b3261e;stroke-width:2}</style><defs><marker id="c1" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M9,0 L9,6 L0,3 z" fill="#1b4d7e"/></marker><marker id="c2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1b4d7e"/></marker><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e9e9ec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#25243f" stroke-width="1.2"/></pattern></defs><text class="t" x="20.0" y="40.0">Pista 2 · Despiece de una orejeta (vista de perfil)</text><text class="s" x="20.0" y="68.0">Un cubo y un cilindro tumbado. El agujero, un solo cilindro hueco largo.</text><rect class="pa" x="120.0" y="268.0" width="168.0" height="168.0"/><circle class="pb" cx="204.0" cy="268.0" r="84.0"/><circle class="ph" cx="204.0" cy="268.0" r="16.8"/><line class="aux" x1="183.2" y1="268.0" x2="224.8" y2="268.0"/><line class="aux" x1="204.0" y1="247.2" x2="204.0" y2="288.8"/><line class="pieza" x1="120.0" y1="436.0" x2="288.0" y2="436.0"/><line class="cota" x1="120.0" y1="466.0" x2="288.0" y2="466.0"/><text class="c" x="204.0" y="458.0" text-anchor="middle">40</text><line class="aux" x1="120.0" y1="436.0" x2="120.0" y2="460.0"/><line class="aux" x1="288.0" y1="436.0" x2="288.0" y2="460.0"/><line class="cota" x1="90.0" y1="268.0" x2="90.0" y2="436.0"/><text class="q" x="80.0" y="357.0" text-anchor="end">?</text><line class="aux" x1="116.0" y1="268.0" x2="84.0" y2="268.0"/><line class="aux" x1="116.0" y1="436.0" x2="84.0" y2="436.0"/><line class="cota" x1="328.0" y1="184.0" x2="328.0" y2="436.0"/><text class="c" x="338.0" y="315.0">60</text><line class="aux" x1="204.0" y1="184.0" x2="334.0" y2="184.0"/><line class="aux" x1="204.0" y1="436.0" x2="334.0" y2="436.0"/><text class="n" x="560.0" y="150.0">Azul: cubo de 5 × 40 × ?</text><text class="n" x="560.0" y="176.0">Verde: cilindro de Ø40 y 5 de largo,</text><text class="n" x="560.0" y="200.0">girado 90° para que quede tumbado.</text><text class="n" x="560.0" y="236.0">Gris: cilindro hueco de Ø8 girado,</text><text class="n" x="560.0" y="260.0">tan largo que cruce las dos orejetas.</text><text class="n" x="560.0" y="300.0">Después de girar un cilindro, ¿qué</text><text class="n" x="560.0" y="324.0">elevación necesita para que su centro</text><text class="n" x="560.0" y="348.0">quede a 40 de la base?</text></svg>